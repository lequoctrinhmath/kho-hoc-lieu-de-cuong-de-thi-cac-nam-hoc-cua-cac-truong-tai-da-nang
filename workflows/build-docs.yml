name: Cập nhật danh sách tài liệu

on:
  push:
    paths:
      - "tai-lieu/**"
      - "schools.json"
      - "scripts/build_docs.py"
  workflow_dispatch:        # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Dựng docs.json từ thư mục tai-lieu
        run: python scripts/build_docs.py
      - name: Lưu kết quả
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs.json schools.json
          git diff --staged --quiet || git commit -m "Tự động cập nhật danh sách tài liệu"
          git push
